name: Проверка сайта

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Сборка и проверки
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Проверить JavaScript
        run: npm run check
      - name: Проверить ресурсы и HTTP
        run: npm test
      - name: Собрать сайт
        run: npm run build
